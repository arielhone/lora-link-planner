<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LoRa Link Planner — Israel</title>
    <meta name="description" content="Will my LoRa message get through? Click two points on a map of Israel and see the terrain, the Fresnel zone and the link budget. Coverage maps and relay planning included." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 L10 14 L15 20 L21 8 L30 26Z' fill='%2316a34a'/%3E%3Cpath d='M4 10 Q16 -2 28 10' stroke='%232563eb' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <h1>📡 <span data-i18n="app.title">LoRa Link Planner</span> <span class="sub" data-i18n="app.israel">Israel</span></h1>
      <nav>
        <a href="./field.html" id="field-link" data-i18n="nav.field">Field mode</a>
        <a href="https://github.com/arielhuna/lora-link-planner/blob/main/docs/LEARN.md" target="_blank" rel="noopener" data-i18n="nav.learn">Learn</a>
        <a href="https://github.com/arielhuna/lora-link-planner" target="_blank" rel="noopener" data-i18n="nav.github">GitHub</a>
        <button type="button" id="lang" class="lang" data-i18n="lang.toggle" data-i18n-attr="title:lang.toggleTitle">עברית</button>
      </nav>
    </header>

    <main class="planner" id="planner">
      <section class="map-wrap">
        <div id="map" data-i18n-attr="aria-label:map.aria"></div>
        <div class="map-hint" id="map-hint"></div>
        <div class="map-legend" id="map-legend" hidden>
          <span><i class="sw cov-works"></i><span data-i18n="cov.legend.works"></span></span>
          <span><i class="sw cov-marginal"></i><span data-i18n="cov.legend.marginal"></span></span>
          <span><i class="sw cov-fails"></i><span data-i18n="cov.legend.fails"></span></span>
        </div>
        <div class="map-tools" id="map-tools">
          <select id="examples" data-i18n-attr="aria-label:map.examples">
            <option value="" data-i18n="map.examples">Examples…</option>
          </select>
          <button id="swap" type="button" data-i18n-attr="title:map.swap">⇄</button>
          <button id="reset" type="button" data-i18n="map.reset" data-i18n-attr="title:map.resetTitle">Reset</button>
        </div>
      </section>

      <section class="profile-wrap">
        <div class="profile-head">
          <h2 data-i18n="profile.title">Terrain profile</h2>
          <div class="legend">
            <span><i class="sw terrain"></i><span data-i18n="profile.legend.terrain"></span></span>
            <span><i class="sw los"></i><span data-i18n="profile.legend.los"></span></span>
            <span><i class="sw fresnel"></i><span data-i18n="profile.legend.fresnel"></span></span>
            <span><i class="sw block"></i><span data-i18n="profile.legend.block"></span></span>
            <span><i class="sw intrude"></i><span data-i18n="profile.legend.intrude"></span></span>
          </div>
        </div>
        <div id="profile" class="profile"></div>
      </section>

      <aside class="side">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-link" data-mode="link" data-i18n="mode.link">A–B link</button>
          <button type="button" role="tab" id="tab-coverage" data-mode="coverage" data-i18n="mode.coverage">Coverage map</button>
        </div>

        <!-- ===== link mode ===== -->
        <div class="mode-link">
          <div id="relay-banner" class="card banner" hidden></div>
          <div id="result" class="card result empty-card"></div>
          <div id="relay" class="card" hidden></div>

          <details class="card" open>
            <summary data-i18n="ant.title">Antennas</summary>
            <div class="grid2">
              <label><span data-i18n="ant.hA"></span><input id="hA" type="number" min="0" max="500" step="0.5" value="2" /></label>
              <label><span data-i18n="ant.hB"></span><input id="hB" type="number" min="0" max="500" step="0.5" value="2" /></label>
            </div>
            <p class="coords" id="coords"></p>
          </details>
        </div>

        <!-- ===== coverage mode ===== -->
        <div class="mode-coverage">
          <div class="card" id="coverage">
            <h3 data-i18n="cov.title">Coverage map</h3>
            <p class="hint" data-i18n="cov.intro"></p>
            <p class="coords" id="cov-tx"></p>
            <div class="grid2">
              <label><span data-i18n="cov.txHeight"></span><input id="cov-txh" type="number" min="0" max="500" step="0.5" value="2" /></label>
              <label><span data-i18n="cov.rxHeight"></span><input id="cov-rxh" type="number" min="0" max="500" step="0.5" value="2" /></label>
              <label><span data-i18n="cov.radius"></span>
                <select id="cov-radius"><option value="5">5 km</option><option value="10">10 km</option><option value="15">15 km</option><option value="20">20 km</option><option value="30">30 km</option></select>
              </label>
              <label><span data-i18n="cov.resolution"></span>
                <select id="cov-res"><option value="normal" data-i18n="cov.res.normal"></option><option value="fine" data-i18n="cov.res.fine"></option></select>
              </label>
            </div>
            <div class="row">
              <button type="button" class="primary" id="cov-run" data-i18n="cov.run">Compute coverage</button>
              <button type="button" id="cov-cancel" data-i18n="cov.cancel" hidden>Cancel</button>
            </div>
            <div class="progress" id="cov-progress" hidden><div class="bar"></div><span></span></div>
            <p id="cov-status" class="hint"></p>
            <p id="cov-summary" class="cov-summary"></p>
            <p class="hint" data-i18n="cov.clickHint"></p>
          </div>
        </div>

        <!-- ===== shared ===== -->
        <details class="card" open>
          <summary data-i18n="set.title">Radio settings</summary>
          <div class="grid2" id="settings">
            <label><span data-i18n="set.freq"></span><input data-key="freqMHz" type="number" min="137" max="2500" step="0.1" /></label>
            <label><span data-i18n="set.txPower"></span><input data-key="txPowerDbm" type="number" min="-9" max="30" step="1" /></label>
            <label><span data-i18n="set.txGain"></span><input data-key="txGainDbi" type="number" min="-10" max="30" step="0.5" /></label>
            <label><span data-i18n="set.rxGain"></span><input data-key="rxGainDbi" type="number" min="-10" max="30" step="0.5" /></label>
            <label><span data-i18n="set.txCable"></span><input data-key="txCableLossDb" type="number" min="0" max="20" step="0.1" /></label>
            <label><span data-i18n="set.rxCable"></span><input data-key="rxCableLossDb" type="number" min="0" max="20" step="0.1" /></label>
            <label><span data-i18n="set.sf"></span>
              <select data-key="sf"><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
            </label>
            <label><span data-i18n="set.bw"></span>
              <select data-key="bandwidthKHz"><option>125</option><option>250</option><option>500</option></select>
            </label>
            <label><span data-i18n="set.env"></span>
              <select data-key="environment">
                <option value="open" data-i18n="set.env.open"></option>
                <option value="suburban" data-i18n="set.env.suburban"></option>
                <option value="urban" data-i18n="set.env.urban"></option>
                <option value="custom" data-i18n="set.env.custom"></option>
              </select>
            </label>
            <label><span data-i18n="set.clutter"></span><input data-key="clutterLossDb" type="number" min="0" max="60" step="0.5" /></label>
            <label><span data-i18n="set.chip"></span>
              <select data-key="chip"><option value="sx1262">SX1262 / SX126x</option><option value="sx1276">SX1276 / RFM95</option></select>
            </label>
            <label><span data-i18n="set.payload"></span><input data-key="payloadBytes" type="number" min="1" max="255" step="1" /></label>
            <label><span data-i18n="set.cr"></span>
              <select data-key="codingRate"><option value="1">4/5</option><option value="2">4/6</option><option value="3">4/7</option><option value="4">4/8</option></select>
            </label>
            <label><span data-i18n="set.model"></span>
              <select data-key="diffraction"><option value="deygout" data-i18n="set.model.deygout"></option><option value="single" data-i18n="set.model.single"></option><option value="none" data-i18n="set.model.none"></option></select>
            </label>
          </div>
          <p class="hint" data-i18n-html="set.israel_html"></p>
          <div id="compliance"></div>
        </details>

        <div id="whatif" class="card mode-link"></div>
      </aside>
    </main>

    <footer class="foot" data-i18n-html="foot.planner_html"></footer>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
