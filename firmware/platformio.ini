; LoRa range-test firmware for the Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262).
;
;   pio run -e sender   -t upload     ; flash a sender
;   pio run -e receiver -t upload     ; flash a receiver
;   pio device monitor                ; see the CSV output (115200 baud)
;
; The mode can also be switched at runtime with the PRG button.
; Radio settings live in include/config.h and match the web app defaults.

[platformio]
default_envs = sender, receiver

[env]
platform = espressif32@^6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_flags =
    -Wall

[env:sender]
build_flags =
    ${env.build_flags}
    -DDEFAULT_MODE_SENDER=1

[env:receiver]
build_flags =
    ${env.build_flags}
    -DDEFAULT_MODE_SENDER=0
