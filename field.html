<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field mode — LoRa Link Planner</title>
    <meta name="description" content="Log real LoRa range tests, compare them with the planner's predictions and calibrate the environment loss." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 L10 14 L15 20 L21 8 L30 26Z' fill='%2316a34a'/%3E%3Cpath d='M4 10 Q16 -2 28 10' stroke='%232563eb' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
  </head>
  <body class="field-page">
    <header class="topbar">
      <h1>📡 <span data-i18n="app.title">LoRa Link Planner</span> <span class="sub" data-i18n="app.fieldMode">Field mode</span></h1>
      <nav>
        <a href="./index.html" id="planner-link" data-i18n="nav.planner">Planner</a>
        <a href="https://github.com/arielhuna/lora-link-planner/blob/main/docs/LEARN.md" target="_blank" rel="noopener" data-i18n="nav.learn">Learn</a>
        <a href="https://github.com/arielhuna/lora-link-planner/tree/main/firmware" target="_blank" rel="noopener" data-i18n="nav.firmware">Firmware</a>
        <button type="button" id="lang" class="lang" data-i18n="lang.toggle" data-i18n-attr="title:lang.toggleTitle">עברית</button>
      </nav>
    </header>

    <main class="field">
      <section class="card log-form">
        <h2 data-i18n="field.logTitle">Log a field test</h2>
        <p class="hint" data-i18n-html="field.hint_html"></p>
        <div id="fmap"></div>
        <form id="form">
          <div class="grid3">
            <label><span data-i18n="field.aLat"></span><input name="a_lat" type="number" step="any" required /></label>
            <label><span data-i18n="field.aLon"></span><input name="a_lon" type="number" step="any" required /></label>
            <label><span data-i18n="field.aH"></span><input name="a_height_m" type="number" step="0.5" min="0" value="2" /></label>
            <label><span data-i18n="field.bLat"></span><input name="b_lat" type="number" step="any" required /></label>
            <label><span data-i18n="field.bLon"></span><input name="b_lon" type="number" step="any" required /></label>
            <label><span data-i18n="field.bH"></span><input name="b_height_m" type="number" step="0.5" min="0" value="2" /></label>
          </div>
          <div class="grid3">
            <label><span data-i18n="field.freq"></span><input name="freq_mhz" type="number" step="0.1" value="917.3" /></label>
            <label><span data-i18n="field.sf"></span><select name="sf"><option>7</option><option>8</option><option selected>9</option><option>10</option><option>11</option><option>12</option></select></label>
            <label><span data-i18n="field.bw"></span><select name="bw_khz"><option selected>125</option><option>250</option><option>500</option></select></label>
            <label><span data-i18n="field.txPower"></span><input name="tx_power_dbm" type="number" step="1" value="14" /></label>
            <label><span data-i18n="field.txGain"></span><input name="tx_gain_dbi" type="number" step="0.5" value="0" /></label>
            <label><span data-i18n="field.rxGain"></span><input name="rx_gain_dbi" type="number" step="0.5" value="0" /></label>
            <label><span data-i18n="field.txCable"></span><input name="tx_cable_loss_db" type="number" step="0.1" value="0" /></label>
            <label><span data-i18n="field.rxCable"></span><input name="rx_cable_loss_db" type="number" step="0.1" value="0" /></label>
            <span></span>
          </div>
          <div class="grid3 measured">
            <label><span data-i18n="field.rssi"></span><input name="rssi_dbm" type="number" step="0.5" required placeholder="-112" /></label>
            <label><span data-i18n="field.snr"></span><input name="snr_db" type="number" step="0.25" placeholder="-4.5" /></label>
            <label><span data-i18n="field.packets"></span><span class="pair"><input name="packets_lost" type="number" min="0" step="1" data-i18n-attr="placeholder:field.lost" /><input name="packets_received" type="number" min="0" step="1" data-i18n-attr="placeholder:field.rcvd" /></span></label>
          </div>
          <label><span data-i18n="field.notes"></span><input name="notes" type="text" data-i18n-attr="placeholder:field.notesPh" /></label>
          <div class="row">
            <button class="primary" type="submit" data-i18n="field.add">Add test</button>
            <span id="form-msg" class="hint"></span>
          </div>
        </form>
      </section>

      <section class="card results-panel">
        <div class="row between">
          <h2 data-i18n="field.resultsTitle">Predicted vs measured</h2>
          <div class="row">
            <label class="filebtn"><span data-i18n="field.import"></span><input id="import" type="file" accept=".csv,text/csv,text/plain" hidden /></label>
            <button id="export" type="button" data-i18n="field.export">Export CSV</button>
            <button id="recompute" type="button" data-i18n-attr="title:field.recompute">↻</button>
            <button id="clear" type="button" data-i18n="field.clear">Clear all</button>
          </div>
        </div>
        <p class="hint" data-i18n="field.importHint"></p>
        <div class="grid3 env-row">
          <label><span data-i18n="field.env"></span>
            <select id="env">
              <option value="open" data-i18n="set.env.open"></option>
              <option value="suburban" data-i18n="set.env.suburban"></option>
              <option value="urban" data-i18n="set.env.urban"></option>
              <option value="custom" data-i18n="set.env.custom"></option>
            </select>
          </label>
          <label><span data-i18n="set.clutter"></span><input id="clutter" type="number" min="0" max="60" step="0.5" value="0" /></label>
        </div>
        <div id="stats" class="stats"></div>
        <div id="errchart" class="errchart"></div>
        <div class="card calibrate">
          <h3 data-i18n="field.calTitle">Environment calibration</h3>
          <p class="hint" data-i18n="field.calIntro"></p>
          <button type="button" id="calibrate" data-i18n="field.calButton">Compute best-fit extra loss</button>
          <div id="cal-result"></div>
        </div>
        <div class="tablewrap"><table id="table" class="tests"></table></div>
      </section>
    </main>

    <footer class="foot" data-i18n-html="foot.field_html"></footer>
    <script type="module" src="/src/field/main.js"></script>
  </body>
</html>
